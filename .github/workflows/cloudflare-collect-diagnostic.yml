name: Cloudflare Collect Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-sentry-cloudflare-collect-diagnostic-production
  cancel-in-progress: false

jobs:
  collect-diagnostic:
    name: Cloudflare collect diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/cloudflare/package-lock.json

      - name: Install Cloudflare Worker dependencies
        working-directory: frontend/cloudflare
        run: npm ci

      - name: Query and sanitize latest collect continuity
        working-directory: frontend/cloudflare
        env:
          # This token must be scoped to account D1 read access only.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node_modules/.bin/wrangler d1 execute ns-db --remote \
            --command "SELECT value, updated_at FROM ops_state WHERE key='last:collect-cycle'" \
            --json > /tmp/news-sentry-collect-diagnostic-raw.json
          cd ../..
          python tools/cloudflare_collect_diagnostic.py \
            --input /tmp/news-sentry-collect-diagnostic-raw.json \
            --output /tmp/news-sentry-collect-diagnostic.json

      - name: Upload sanitized collect diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudflare-collect-diagnostic-${{ github.run_id }}
          path: /tmp/news-sentry-collect-diagnostic.json
          if-no-files-found: error
          retention-days: 7
