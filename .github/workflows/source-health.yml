name: Source Health Audit

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Optional target id to audit; leave blank for all active targets"
        required: false
        default: ""
      limit:
        description: "Optional source row limit for smoke runs"
        required: false
        default: ""
      max_failed:
        description: "Fail when failed live checks exceed this count"
        required: false
        default: "0"
      bootstrap_weekly_slo:
        description: "Allow first audited Source Health SLO run without previous summary"
        required: true
        default: "false"
  schedule:
    # Weekly source health sweep. Network conditions vary, so the JSONL receipt
    # is the durable review surface when sources fail.
    - cron: "23 2 * * 1"

permissions:
  actions: read
  contents: read

jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]"

      - name: Static source coverage gate
        run: |
          python tools/source_coverage_report.py \
            --minimum-refs 20 \
            --receipt-output /tmp/news-sentry-source-coverage-receipts.jsonl \
            --pretty > /tmp/news-sentry-source-coverage.json

      - name: Resolve Source Health SLO metadata
        id: slo-metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Resolve deployed commit from the latest successful main production receipt"
          receipt_dir="/tmp/news-sentry-production-deploy-receipt"
          mkdir -p "${receipt_dir}"
          found="false"
          while IFS=$'\t' read -r run_id head_sha; do
            artifact_name="cloudflare-production-deploy-receipt-${head_sha}"
            if ! gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              | jq -e --arg name "${artifact_name}" '.artifacts[]? | select(.name == $name and .expired == false)' \
              >/dev/null; then
              continue
            fi
            gh run download "${run_id}" --name "${artifact_name}" --dir "${receipt_dir}"
            python tools/deploy_receipt_metadata.py \
              --receipt "${receipt_dir}/news-sentry-cloudflare-deploy-receipt.json" \
              --expected-commit "${head_sha}" \
              --output /tmp/news-sentry-source-health-deployment.json
            found="true"
            break
          done < <(gh run list --workflow deploy.yml --branch main --status success --limit 20 \
            --json databaseId,headSha --jq '.[] | [.databaseId, .headSha] | @tsv')
          if [[ "${found}" != "true" ]]; then
            echo "No validated successful main production deploy receipt found." >&2
            exit 1
          fi
          SLO_ENVIRONMENT="$(python -c 'import json;print(json.load(open("/tmp/news-sentry-source-health-deployment.json"))["environment"])')"
          SLO_DEPLOYED_COMMIT="$(python -c 'import json;print(json.load(open("/tmp/news-sentry-source-health-deployment.json"))["deployed_commit"])')"
          printf '%s=%s\n' "environment" "${SLO_ENVIRONMENT}" >> "${GITHUB_OUTPUT}"
          printf '%s=%s\n' "deployed_commit" "${SLO_DEPLOYED_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Download previous Source Health SLO
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_WEEKLY_SLO: ${{ github.event.inputs.bootstrap_weekly_slo || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/news-sentry-source-health-previous
          previous_run_id="$(gh run list --workflow source-health.yml --status success --limit 5 --json databaseId --jq '.[0].databaseId // ""')"
          if [[ -n "${previous_run_id}" ]]; then
            gh run download "${previous_run_id}" \
              --name source-health-receipts \
              --dir /tmp/news-sentry-source-health-previous || true
          fi
          if [[ -f /tmp/news-sentry-source-health-previous/news-sentry-source-health-slo.json ]]; then
            cp /tmp/news-sentry-source-health-previous/news-sentry-source-health-slo.json /tmp/news-sentry-source-health-slo-previous.json
          elif [[ "${BOOTSTRAP_WEEKLY_SLO}" != "true" ]]; then
            echo "No previous Source Health SLO receipt found; set bootstrap_weekly_slo=true for an audited bootstrap." >&2
            exit 1
          fi

      - name: Live source health audit
        shell: bash
        env:
          SLO_ENVIRONMENT: ${{ steps.slo-metadata.outputs.environment }}
          SLO_DEPLOYED_COMMIT: ${{ steps.slo-metadata.outputs.deployed_commit }}
        run: |
          set -euo pipefail
          args=(
            --minimum-refs 20
            --concurrency 24
            --per-host-concurrency 4
            --per-host-delay-seconds 0.2
            --timeout-seconds 15
            --min-entries 1
            --output-json /tmp/news-sentry-source-health.json
            --output-jsonl /tmp/news-sentry-source-health.jsonl
            --slo-config config/source-health-slo.yaml
            --output-slo-json /tmp/news-sentry-source-health-slo.json
            --slo-environment "${SLO_ENVIRONMENT}"
            --slo-deployed-commit "${SLO_DEPLOYED_COMMIT}"
            --slo-window current
            --pretty
          )
          if [[ -f /tmp/news-sentry-source-health-slo-previous.json ]]; then
            args+=(--previous-summary-json /tmp/news-sentry-source-health-slo-previous.json)
          elif [[ "${{ github.event.inputs.bootstrap_weekly_slo || 'false' }}" == "true" ]]; then
            args+=(--allow-weekly-bootstrap)
          fi
          if [[ -n "${{ github.event.inputs.target || '' }}" ]]; then
            args+=(--target "${{ github.event.inputs.target }}")
          fi
          if [[ -n "${{ github.event.inputs.limit || '' }}" ]]; then
            args+=(--limit "${{ github.event.inputs.limit }}")
          fi
          if [[ -n "${{ github.event.inputs.max_failed || '0' }}" ]]; then
            args+=(--max-failed "${{ github.event.inputs.max_failed || '0' }}")
          fi
          python tools/source_health_audit.py "${args[@]}"

      - name: Upload source health receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-receipts
          path: |
            /tmp/news-sentry-source-coverage.json
            /tmp/news-sentry-source-coverage-receipts.jsonl
            /tmp/news-sentry-source-health.json
            /tmp/news-sentry-source-health.jsonl
            /tmp/news-sentry-source-health-slo.json
          if-no-files-found: error
          retention-days: 14
