name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Python 后端检查 ──
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,proxy]"

      - name: Lint (ruff)
        run: python -m ruff check

      - name: Type check (mypy)
        run: python -m mypy src/news_sentry/ --ignore-missing-imports

      - name: Test (pytest + coverage)
        timeout-minutes: 20
        run: python -m pytest tests/ -q --tb=short --timeout=300 --durations=25 --cov=src/news_sentry --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = root.attrib.get('line-rate', '0')
          pct = float(rate) * 100
          print(f'## Coverage: {pct:.1f}%')
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publication hygiene scan
        run: python tools/check_publication_hygiene.py

      - name: Security scan (sensitive keywords)
        run: python tools/scan_sensitive_data.py

      - name: Hardcoded target scan
        run: python tools/check_no_hardcoded_target.py

      - name: Doc facts consistency
        run: python tools/check_doc_facts.py

      - name: Config schema validation
        run: python -m pytest tests/unit/test_config_schema_validation.py -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml

  # ── 前端检查 (public + admin 并行) ──
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        app: [public, admin]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: frontend/${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: frontend/${{ matrix.app }}
        run: npm run lint

      - name: Test
        if: matrix.app == 'public'
        working-directory: frontend/${{ matrix.app }}
        run: npm run test

      - name: E2E Test (Playwright)
        if: matrix.app == 'admin'
        working-directory: frontend/${{ matrix.app }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Build
        working-directory: frontend/${{ matrix.app }}
        run: npm run build
