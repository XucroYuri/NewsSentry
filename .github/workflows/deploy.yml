name: Deploy

on:
  push:
    branches: [main, preview]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/public/package-lock.json
            frontend/admin/package-lock.json
            frontend/cloudflare/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,proxy]"

      - name: Install public frontend dependencies
        working-directory: frontend/public
        run: npm ci

      - name: Public frontend lint
        working-directory: frontend/public
        run: npm run lint

      - name: Public frontend tests
        working-directory: frontend/public
        run: npm run test

      - name: Public frontend build
        working-directory: frontend/public
        env:
          FRONTEND_OUTPUT_SUBDIR: ${{ github.workspace }}/src/news_sentry/static
          VITE_API_BASE: https://api.news-sentry.com
        run: npm run build

      - name: Install admin frontend dependencies
        working-directory: frontend/admin
        run: npm ci

      - name: Admin frontend lint
        working-directory: frontend/admin
        run: npm run lint

      - name: Admin frontend tests
        working-directory: frontend/admin
        run: npm run test

      - name: Admin frontend build
        working-directory: frontend/admin
        env:
          FRONTEND_OUTPUT_SUBDIR: ${{ github.workspace }}/src/news_sentry/static
        run: npm run build

      - name: Admin E2E Test (Playwright)
        working-directory: frontend/admin
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Install Cloudflare Worker dependencies
        working-directory: frontend/cloudflare
        run: npm ci

      - name: Cloudflare Worker behavior tests
        working-directory: frontend/cloudflare
        run: npm test

      - name: Cloudflare Worker type generation
        working-directory: frontend/cloudflare
        run: npm run types

      - name: Cloudflare Worker dry run
        working-directory: frontend/cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node_modules/.bin/wrangler deploy --env="" --dry-run --outdir /tmp/ns-worker-dry-run --containers-rollout none

      - name: Lint (ruff)
        run: python -m ruff check

      - name: Type check (mypy)
        run: python -m mypy src/news_sentry/ --ignore-missing-imports

      - name: Test (pytest)
        timeout-minutes: 20
        run: python -m pytest tests/ -q --tb=short --timeout=300 --durations=25

      - name: Publication hygiene scan
        run: python tools/check_publication_hygiene.py

      - name: Security scan
        run: python tools/scan_sensitive_data.py

      - name: Hardcoded target scan
        run: python tools/check_no_hardcoded_target.py

      - name: Config schema validation
        run: python -m pytest tests/unit/test_config_schema_validation.py -q

      - name: E2E tests
        timeout-minutes: 10
        env:
          NEWSSENTRY_DEPLOYMENT_ENV: local
          NEWSSENTRY_AUTO_COLLECT: "0"
          NEWSSENTRY_AI_ENRICHMENT: "0"
          NEWSSENTRY_PUBLIC_TRANSLATION: "0"
        run: |
          set -euo pipefail
          test -f src/news_sentry/static/public_app/index.html
          test -f src/news_sentry/static/admin/index.html
          python -m pytest tests/e2e/ -m e2e -q --tb=short --timeout=60 -x

  cloudflare-data:
    name: Cloudflare D1 schema migration
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install D1 backfill dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/cloudflare/package-lock.json

      - name: Install Cloudflare Worker dependencies
        working-directory: frontend/cloudflare
        run: npm ci

      - name: Cloudflare D1 backfill dry run
        run: |
          python tools/cloudflare_d1_backfill.py \
            --data-dir data \
            --targets-dir config/targets \
            --dry-run \
            --limit 100 \
            --output-sql /tmp/news-sentry-d1-backfill.sql

      - name: Apply Cloudflare D1 breaking intelligence migration
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        working-directory: frontend/cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if node_modules/.bin/wrangler d1 execute ns-db --remote --command \
            "SELECT breaking_score FROM events LIMIT 1" >/tmp/ns-d1-breaking-check.json 2>/tmp/ns-d1-breaking-check.err; then
            echo "events.breaking_score already exists"
          elif grep -q "no such table: events" /tmp/ns-d1-breaking-check.err; then
            cat /tmp/ns-d1-breaking-check.err
            echo "events table is absent; db/schema.sql will initialize breaking columns"
          else
            cat /tmp/ns-d1-breaking-check.err
            node_modules/.bin/wrangler d1 execute ns-db --remote \
              --file=db/migrations/20260701_breaking_intelligence_i18n.sql
          fi

      - name: Apply Cloudflare D1 schema
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        working-directory: frontend/cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node_modules/.bin/wrangler d1 execute ns-db --remote --file=db/schema.sql

      - name: Apply Cloudflare D1 shadow job runtime migration
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        working-directory: frontend/cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node_modules/.bin/wrangler d1 execute ns-db --remote
          --file=db/migrations/20260801_phase1_job_runtime.sql

      - name: Record Cloudflare D1 runtime migration receipts
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        working-directory: frontend/cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python ../../tools/cloudflare_deploy_guard.py record-runtime-receipts \
            --wrangler node_modules/.bin/wrangler \
            --wrangler-toml wrangler.toml \
            --output /tmp/news-sentry-runtime-migration-receipts.json

      - name: Apply Cloudflare D1 target collect flag migration
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        working-directory: frontend/cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if node_modules/.bin/wrangler d1 execute ns-db --remote --command \
            "SELECT cloudflare_collect_enabled FROM targets LIMIT 1" >/tmp/ns-d1-column-check.json 2>/tmp/ns-d1-column-check.err; then
            echo "targets.cloudflare_collect_enabled already exists"
          else
            cat /tmp/ns-d1-column-check.err
            node_modules/.bin/wrangler d1 execute ns-db --remote \
              --file=db/migrations/20260630_add_target_collect_enabled.sql
          fi

      - name: Apply Cloudflare D1 target and source sync
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python tools/cloudflare_d1_backfill.py \
            --data-dir data \
            --targets-dir config/targets \
            --limit 0 \
            --output-sql /tmp/news-sentry-d1-target-sync.sql
          (cd frontend/cloudflare && node_modules/.bin/wrangler d1 execute ns-db --remote \
            --file /tmp/news-sentry-d1-target-sync.sql)

      - name: Refresh Cloudflare public read snapshots
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python tools/cloudflare_refresh_public_snapshots.py \
            --wrangler-dir frontend/cloudflare \
            --database ns-db \
            --output-sql /tmp/news-sentry-public-read-snapshots.sql
          (cd frontend/cloudflare && node_modules/.bin/wrangler d1 execute ns-db --remote \
            --file /tmp/news-sentry-public-read-snapshots.sql)

  deploy-cloudflare-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: [ci, cloudflare-data]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/cloudflare/package-lock.json

      - name: Install Cloudflare Worker dependencies
        working-directory: frontend/cloudflare
        run: npm ci

      - name: Cloudflare runtime preflight receipt
        working-directory: frontend/cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python ../../tools/cloudflare_deploy_guard.py preflight \
            --wrangler node_modules/.bin/wrangler \
            --wrangler-toml wrangler.toml \
            --output /tmp/news-sentry-cloudflare-preflight.json

      - name: Deploy Cloudflare Worker
        working-directory: frontend/cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
        run: |
          set -euo pipefail
          : "${CF_ACCESS_TEAM_DOMAIN:?GitHub environment variable CF_ACCESS_TEAM_DOMAIN is required}"
          : "${CF_ACCESS_AUD:?GitHub environment variable CF_ACCESS_AUD is required}"
          node_modules/.bin/wrangler deploy --env="" --containers-rollout gradual \
            --var "NEWS_SENTRY_DEPLOY_COMMIT:${GITHUB_SHA}" \
            --var "NEWS_SENTRY_ENVIRONMENT:production" \
            --var "SCHEDULER_MODE:shadow" \
            --var "WORKER_NATIVE_COLLECT_ENABLED:false" \
            --var "CF_ACCESS_TEAM_DOMAIN:${CF_ACCESS_TEAM_DOMAIN}" \
            --var "CF_ACCESS_AUD:${CF_ACCESS_AUD}"

      - name: Verify Cloudflare Worker health
        timeout-minutes: 25
        run: |
          set -euo pipefail
          verify_worker_receipt() {
            python - "$1" "$2" "$3" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          mode, body_path, headers_path = sys.argv[1:]
          headers = {}
          for line in Path(headers_path).read_text(errors="replace").splitlines():
              if ":" in line:
                  key, value = line.split(":", 1)
                  headers[key.strip().lower()] = value.strip()

          body = json.loads(Path(body_path).read_text())
          assert body.get("status") == "ok", f"Worker {mode} status is not ok"
          assert headers.get("x-news-sentry-runtime") == "cloudflare-worker"
          assert headers.get("x-news-sentry-deploy-commit") == os.environ["GITHUB_SHA"]
          assert headers.get("x-news-sentry-worker-version"), "Worker version receipt missing"
          if mode == "ready":
              assert body.get("readiness", {}).get("ok") is True, "Worker readiness is false"
              assert body.get("deployment", {}).get("commit") == os.environ["GITHUB_SHA"]
              assert body.get("deployment", {}).get("scheduler_mode") == "shadow"
              assert body.get("deployment", {}).get("worker_native_collect_enabled") is False
              assert body.get("deployment", {}).get("collection_authoritative") is False
          PY
          }

          for i in $(seq 1 60); do
            STATUS=$(curl -sS \
              -A "Mozilla/5.0 (compatible; NewsSentryDeploy/1.0; +https://news-sentry.com)" \
              -H "Accept: application/json" \
              -D /tmp/worker-live.headers \
              -o /tmp/worker-live.json \
              -w "%{http_code}" \
              "https://api.news-sentry.com/api/v1/live" || true)
            if [ "$STATUS" = "200" ] && verify_worker_receipt \
              live /tmp/worker-live.json /tmp/worker-live.headers; then
              break
            fi
            echo "Waiting for Worker deployment receipt... (attempt $i, HTTP ${STATUS:-000})"
            if [ -s /tmp/worker-live.json ]; then
              head -c 500 /tmp/worker-live.json || true
              echo
            fi
            if [ "$i" = "60" ]; then
              echo "Cloudflare Worker liveness/deployment receipt check failed"
              exit 1
            fi
            sleep 5
          done

          for i in $(seq 1 240); do
            STATUS=$(curl -sS \
              -A "Mozilla/5.0 (compatible; NewsSentryDeploy/1.0; +https://news-sentry.com)" \
              -H "Accept: application/json" \
              -D /tmp/worker-ready.headers \
              -o /tmp/worker-ready.json \
              -w "%{http_code}" \
              "https://api.news-sentry.com/api/v1/ready" || true)
            if [ "$STATUS" = "200" ] && verify_worker_receipt \
              ready /tmp/worker-ready.json /tmp/worker-ready.headers; then
              cat /tmp/worker-ready.json
              exit 0
            fi
            echo "Waiting for truthful Worker readiness... (attempt $i, HTTP ${STATUS:-000})"
            if [ -s /tmp/worker-ready.json ]; then
              head -c 1000 /tmp/worker-ready.json || true
              echo
            fi
            if [ "$i" = "240" ]; then
              echo "Cloudflare Worker readiness check failed"
              exit 1
            fi
            sleep 5
          done

      - name: Collect Cloudflare Worker deployment receipt
        working-directory: frontend/cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node_modules/.bin/wrangler versions list --json > /tmp/ns-worker-versions.json
          node_modules/.bin/wrangler deployments list --json > /tmp/ns-worker-deployments.json
          node_modules/.bin/wrangler d1 execute ns-db --remote \
            --command "SELECT migration_id FROM runtime_migration_receipts ORDER BY migration_id" \
            --json > /tmp/ns-d1-runtime-migration-receipts.json
          python - <<'PY'
          import json
          from pathlib import Path

          def rows(value):
              if isinstance(value, list) and value and isinstance(value[0], dict) and isinstance(value[0].get("results"), list):
                  return value[0]["results"]
              if isinstance(value, list):
                  return value
              if isinstance(value, dict):
                  for key in ("results", "result", "items"):
                      if isinstance(value.get(key), list):
                          return value[key]
              return []

          versions = rows(json.loads(Path("/tmp/ns-worker-versions.json").read_text()))
          deployments = rows(json.loads(Path("/tmp/ns-worker-deployments.json").read_text()))
          migrations = rows(json.loads(Path("/tmp/ns-d1-runtime-migration-receipts.json").read_text()))
          Path("/tmp/ns-worker-version.json").write_text(json.dumps(versions[0] if versions else {}))
          Path("/tmp/ns-worker-deployment.json").write_text(json.dumps(deployments[0] if deployments else {}))
          Path("/tmp/ns-runtime-migration-receipts.json").write_text(json.dumps([
              row.get("migration_id") for row in migrations if isinstance(row, dict) and row.get("migration_id")
          ]))
          PY
          cd ../..
          python tools/cloudflare_deploy_guard.py receipt \
            --expected-commit "${GITHUB_SHA}" \
            --expected-scheduler-mode shadow \
            --version-json /tmp/ns-worker-version.json \
            --deployment-json /tmp/ns-worker-deployment.json \
            --health-json /tmp/worker-ready.json \
            --runtime-migration-receipts-json /tmp/ns-runtime-migration-receipts.json \
            --queue-receipt-json /tmp/news-sentry-cloudflare-preflight.json \
            --output /tmp/news-sentry-cloudflare-deploy-receipt.json

  deploy-cloudflare-pages:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    outputs:
      pages_url: ${{ steps.deploy.outputs.pages_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/public/package-lock.json

      - name: Install public frontend dependencies
        working-directory: frontend/public
        run: npm ci

      - name: Build public frontend
        working-directory: frontend/public
        env:
          VITE_API_BASE: https://api.news-sentry.com
        run: npm run build

      - name: Deploy Cloudflare Pages
        id: deploy
        working-directory: frontend/public
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME:-preview}"
          npx wrangler pages deploy dist/ \
            --project-name=news-sentry \
            --branch "${branch}" \
            --commit-dirty=true | tee /tmp/news-sentry-pages-deploy.log
          pages_url="$(grep -Eo 'https://[^[:space:]]+\\.pages\\.dev' /tmp/news-sentry-pages-deploy.log | tail -1 || true)"
          if [ -z "${pages_url}" ]; then
            pages_url="https://news-sentry.pages.dev"
          fi
          echo "pages_url=${pages_url}" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare Pages deployment
        run: |
          set -euo pipefail
          PAGES_URL="${{ steps.deploy.outputs.pages_url }}"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /tmp/pages.html -w "%{http_code}" "$PAGES_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              grep -Eq "News Sentry|NewsSentry" /tmp/pages.html
              exit 0
            fi
            echo "Waiting for Pages deployment... (attempt $i, HTTP $STATUS)"
            sleep 5
          done
          echo "Cloudflare Pages verification timed out"
          exit 1

  verify-preview:
    name: Verify preview
    runs-on: ubuntu-latest
    needs: [deploy-cloudflare-pages, cloudflare-data]
    if: github.ref == 'refs/heads/preview'
    env:
      BASE_URL: https://preview.news-sentry.com
      PAGES_URL: ${{ needs.deploy-cloudflare-pages.outputs.pages_url }}
      API_URL: https://api.news-sentry.com
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/cloudflare/package-lock.json

      - name: Install Cloudflare Worker dependencies
        working-directory: frontend/cloudflare
        run: npm ci

      - name: Verify preview Cloudflare-native public endpoints
        run: |
          set -euo pipefail
          curl -fsS -A "Mozilla/5.0 (compatible; NewsSentryDeploy/1.0; +https://news-sentry.com)" -H "Accept: application/json" "${API_URL}/api/v1/health" > /tmp/health.json
          curl -fsS -A "Mozilla/5.0 (compatible; NewsSentryDeploy/1.0; +https://news-sentry.com)" -H "Accept: application/json" "${API_URL}/api/v1/public/news?page_size=3" > /tmp/public-news.json
          curl -fsS -A "Mozilla/5.0 (compatible; NewsSentryDeploy/1.0; +https://news-sentry.com)" -H "Accept: application/json" "${API_URL}/api/v1/public/facets" > /tmp/facets.json
          curl -fsS -o /tmp/public-app.html "${PAGES_URL:-${BASE_URL}}/"

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/health.json").read_text())
          news = json.loads(Path("/tmp/public-news.json").read_text())
          facets = json.loads(Path("/tmp/facets.json").read_text())

          assert health.get("status") == "ok", "Worker health is not ok"
          assert isinstance(health.get("total_events"), int), "health total_events missing"
          assert isinstance(news.get("items"), list), "public news response missing items"
          assert {"regions", "issues", "related"} <= set(facets), "facets payload missing expected keys"
          public_app_html = Path("/tmp/public-app.html").read_text(errors="ignore")
          assert "News Sentry" in public_app_html or "NewsSentry" in public_app_html
          PY

  promote-main:
    name: Promote main
    runs-on: ubuntu-latest
    needs: verify-preview
    if: github.ref == 'refs/heads/preview'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main to verified preview
        run: |
          set -euo pipefail
          git fetch origin main preview
          if ! git merge-base --is-ancestor origin/main "${GITHUB_SHA}"; then
            echo "origin/main is not an ancestor of verified preview ${GITHUB_SHA}; stop promotion."
            exit 1
          fi
          git push origin "${GITHUB_SHA}:refs/heads/main"

  verify-production:
    name: Verify production
    runs-on: ubuntu-latest
    needs: [deploy-cloudflare-worker, deploy-cloudflare-pages, cloudflare-data]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    env:
      BASE_URL: https://news-sentry.com
      PAGES_URL: ${{ needs.deploy-cloudflare-pages.outputs.pages_url }}
      API_URL: https://api.news-sentry.com
      APEX_API_URL: https://news-sentry.com
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/cloudflare/package-lock.json

      - name: Install Cloudflare Worker dependencies
        working-directory: frontend/cloudflare
        run: npm ci

      - name: Verify production public endpoints
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/health.headers -A "Mozilla/5.0 (compatible; NewsSentryDeploy/1.0; +https://news-sentry.com)" -H "Accept: application/json" "${API_URL}/api/v1/health" > /tmp/health.json
          curl -fsS -D /tmp/apex-health.headers -A "Mozilla/5.0 (compatible; NewsSentryDeploy/1.0; +https://news-sentry.com)" -H "Accept: application/json" "${APEX_API_URL}/api/v1/health" > /tmp/apex-health.json
          curl -fsS -A "Mozilla/5.0 (compatible; NewsSentryDeploy/1.0; +https://news-sentry.com)" -H "Accept: application/json" "${API_URL}/api/v1/public/news?page_size=3" > /tmp/public-news.json
          curl -fsS -A "Mozilla/5.0 (compatible; NewsSentryDeploy/1.0; +https://news-sentry.com)" -H "Accept: application/json" "${API_URL}/api/v1/public/facets" > /tmp/facets.json
          if ! curl -fsS -o /tmp/public-app.html "${BASE_URL}/"; then
            echo "::warning::Apex homepage was blocked for GitHub Actions; checking Pages deployment URL."
            curl -fsS -o /tmp/public-app.html "${PAGES_URL:-${BASE_URL}}/"
          elif ! grep -Eq "News Sentry|NewsSentry" /tmp/public-app.html; then
            echo "::warning::Apex homepage did not expose the app shell to GitHub Actions; checking Pages deployment URL."
            curl -fsS -o /tmp/public-app.html "${PAGES_URL:-${BASE_URL}}/"
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_headers(path: str) -> dict[str, str]:
              parsed = {}
              for line in Path(path).read_text(errors="replace").splitlines():
                  if ":" in line:
                      key, value = line.split(":", 1)
                      parsed[key.strip().lower()] = value.strip()
              return parsed

          health = json.loads(Path("/tmp/health.json").read_text())
          apex_health = json.loads(Path("/tmp/apex-health.json").read_text())
          health_headers = load_headers("/tmp/health.headers")
          apex_health_headers = load_headers("/tmp/apex-health.headers")
          news = json.loads(Path("/tmp/public-news.json").read_text())
          facets = json.loads(Path("/tmp/facets.json").read_text())

          assert health.get("status") == "ok", "Worker health is not ok"
          assert apex_health.get("status") == "ok", "Apex API Worker health is not ok"
          assert health.get("deployment", {}).get("commit") == os.environ["GITHUB_SHA"]
          assert apex_health.get("deployment", {}).get("commit") == os.environ["GITHUB_SHA"]
          assert health_headers.get("x-news-sentry-deploy-commit") == os.environ["GITHUB_SHA"]
          assert apex_health_headers.get("x-news-sentry-deploy-commit") == os.environ["GITHUB_SHA"]
          assert health_headers.get("x-news-sentry-worker-version")
          assert apex_health_headers.get("x-news-sentry-worker-version")
          assert isinstance(health.get("total_events"), int), "health total_events missing"
          assert apex_health.get("total_events") == health.get("total_events"), "Apex API health does not match API subdomain"
          assert health.get("total_events", 0) > 0, "Cloudflare D1 has no events"
          assert isinstance(news.get("items"), list) and news["items"], "public news is empty"
          assert {"regions", "issues", "related"} <= set(facets), "facets payload missing expected keys"
          public_app_html = Path("/tmp/public-app.html").read_text(errors="ignore")
          assert "News Sentry" in public_app_html or "NewsSentry" in public_app_html
          PY

      - name: Live quality gate with HEAD probe
        run: |
          set -euo pipefail
          python tools/cloudflare_live_quality_check.py \
            --base-url "${BASE_URL}" \
            --api-url "${API_URL}" \
            --min-featured 100 \
            --max-latest-age-hours 24 \
            --min-summary-ready 500 \
            --min-d1-targets 80

      - name: Verify SEO/GEO public site
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -q
          python -m pip install uv -q
          if ! uv run --no-project --with 'httpx[socks]' --with pyyaml \
            python tools/seo_geo/verify_public_site.py \
              --base-url "${BASE_URL}" \
              --expected-origin "${BASE_URL}" \
              --timeout-seconds 90 \
              --output /tmp/news-sentry-verify-public-site.json; then
            echo "::warning::Apex SEO/GEO check failed or was challenged; retrying against the Pages deployment URL."
            cat /tmp/news-sentry-verify-public-site.json || true
            uv run --no-project --with 'httpx[socks]' --with pyyaml \
              python tools/seo_geo/verify_public_site.py \
                --base-url "${PAGES_URL:-${BASE_URL}}" \
                --expected-origin "${BASE_URL}" \
                --timeout-seconds 90 \
                --output /tmp/news-sentry-verify-public-site.json
          fi

      - name: Audit deployed surface
        env:
          CLOUDFLARE_STATE_JSON: ${{ secrets.CLOUDFLARE_STATE_JSON }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -q
          python -m pip install uv -q
          if [ -z "${CLOUDFLARE_STATE_JSON}" ]; then
            echo "Missing CLOUDFLARE_STATE_JSON secret; production deployed-surface audit requires Cloudflare state evidence."
            exit 1
          fi
          printf '%s' "${CLOUDFLARE_STATE_JSON}" > /tmp/news-sentry-cloudflare-state.json
          uv run --no-project --with 'httpx[socks]' --with pyyaml \
            python tools/deployed_surface_audit.py \
              --policy config/security/deployment-surface-policy.yaml \
              --cloudflare-state-json /tmp/news-sentry-cloudflare-state.json \
              --base-url "${BASE_URL}" \
              --api-base-url "${API_URL}" \
              --public-base-url-fallback "${PAGES_URL:-${BASE_URL}}" \
              --output /tmp/news-sentry-deployed-surface-audit.json \
              --timeout-seconds 90
